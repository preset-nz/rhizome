[package]
name = "rhizome-pom"
version.workspace = true
description = "POM, the Preset Object Model: the app-unaware base every app's object model is built on. Documents, kinds and their policy, presets, commands, projections."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
rhizome-core = { path = "../rhizome-core", version = "0.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
