# Releases: `just release`. Bumps the workspace version, package.json, the three crates'
# path-dependency versions and Cargo.lock in lockstep from the conventional
# commits since the last tag, writes CHANGELOG.md, rescans the licence lock,
# commits and tags. Pushing and publishing to crates.io stay manual.

[package]
versioned_files = [
    "Cargo.toml",
    "package.json",
    { path = "crates/rhizome-pom/Cargo.toml", dependency = "rhizome-core" },
    { path = "crates/rhizome-pom-tauri/Cargo.toml", dependency = "rhizome-core" },
    { path = "crates/rhizome-pom-tauri/Cargo.toml", dependency = "rhizome-pom" },
    { path = "Cargo.lock", dependency = "rhizome-core" },
    { path = "Cargo.lock", dependency = "rhizome-pom" },
    { path = "Cargo.lock", dependency = "rhizome-pom-tauri" },
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Command"
command = "just check"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes package.json without a trailing newline, which Biome rejects; the licence
# lock hashes Cargo.toml, Cargo.lock and pnpm-lock.yaml, so a bump makes it stale.
[[workflows.steps]]
type = "Command"
command = "./node_modules/.bin/biome format --write package.json && preset-compliance licences scan && git add package.json preset-compliance.lock"
shell = true

[[workflows.steps]]
type = "Command"
command = "git commit -m \"release: $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Release"
